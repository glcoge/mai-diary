[plugin]
enabled = true
config_version = "1.0.0"
admin_qq = []

[schedule]
generate_time = "04:00"
push_time = "08:00"
check_interval_seconds = 60
# ⚠️ 宿主机/容器为 UTC 时本项不生效（引擎直接信墙钟），请直接改容器时区
timezone_offset_hours = 8
# persist_state 已废弃（防重复幂等始终生效，不再受它控制），故不再列出

[message]
filter_mode = "all"
target_chats = ""
min_message_count = 5
min_messages_per_chat = 0
per_message_max_chars = 200

[summary]
min_word_count = 250
max_word_count = 400
style = "diary"
custom_prompt = ""
use_bot_personality = true
self_description = ""

[llm]
# 填**模型名**（不是任务名），须与 WebUI「模型列表」中已注册的名称一致。
# ⚠️ 填 "replyer" 这类任务名会报「未找到名为 'replyer' 的模型」。
# ⚠️ 推理模型（glm-5.x 等默认开思考）跑日记长文本会返回空 choices，
#    请先在该模型的 extra_params 配 {thinking = {type = "disabled"}}。
# 留空 = 用主程序默认模型。
text_model = ""
temperature = 0.7
# timeline 送入 LLM 前的 token 上限。host RPC 有 30s 硬上限，调小此值才能缓解超时
truncate_tokens = 50000
# ⚠️ 超过 30 无效（RPC 会先切断）
timeout_seconds = 60
show_prompt = false

[output]
base_dir = "data/diary"
write_markdown = true
markdown_header_template = "# {date} 日记\n\n"
markdown_footer_template = "\n\n---\n\n*由 mai-diary 插件于 {generated_at} 生成*\n"

[ntfy]
# ⚠️ 启用后日记正文会离开本机（经 ntfy 服务器到手机），请确认接受此边界破坏。
# 模板默认关闭；需要时自行开启并填 topic。
enabled = false
server = "https://ntfy.sh"
# ⚠️ 公共 ntfy.sh 下 topic 名等价于密码，**必须用随机字符串**（如 UUID）。
# 切勿使用 "mai-diary"、"glcoge-mai-diary" 这类可猜测的名字，
# 否则任何人订阅该 topic 都能收到你的日记全文。
topic = ""
auth_token = ""
priority = "default"
tags = [
    "diary",
    "📔",
]
title_template = "新日记  {date}"
failure_title_template = "❌ 日记生成失败  {date}"
body_footer_template = "\n\n—— mai-diary • {word_count}字"
max_body_chars = 2000
truncate_suffix = "\n\n…（已截断，全文见本地文件）"
click_action = ""
send_on_failure = true
timeout_seconds = 10

# ===== 剧本人设联动（glcoge.mai-narrative 握手；失败自动降级为旧逻辑） =====
[narrative]
enabled = true
api_timeout_seconds = 10

# ===== 失败延迟重试（仅针对可恢复错误：LLM 超时/空返回/异常；"消息数量不足"不重试） =====
[retry]
enabled = true
max_attempts = 3              # 重试次数上限（不含首次尝试，即最多 1 + 3 = 4 次生成）
base_delay_minutes = 10       # 首次重试延迟（指数退避：10 / 20 / 40 …）
max_delay_minutes = 120       # 单次重试延迟上限
